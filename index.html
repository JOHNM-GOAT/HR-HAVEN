                <button onclick="toggleBoundaryShield()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-bold ${state.boundaryShield ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-slate-100 border-slate-200 text-slate-600'} transition-all cursor-pointer">

            ` : ''}

              <button onclick="logout()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-50 hover:bg-rose-50 hover:text-rose-600 text-slate-600 border border-slate-200 transition-colors">
                Logout
              </button>
            </div>

          <div class="flex-1 flex">
            <!-- Sidebar with Ice-Blue Gradient matching mockup -->

                <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">Overview</p>

                    <button onclick="navigateToTab('analytics')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${state.activeTab === 'analytics' ? 'bg-white text-blue-600 font-extrabold shadow-xs border border-slate-200/80' : 'text-slate-700 hover:text-slate-900 hover:bg-white/60'}">
                      <div class="flex items-center gap-3"><span></span><span>AI Burnout Predictor</span></div>
                      <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full ${state.activeTab === 'analytics' ? 'bg-blue-600 text-white' : 'bg-slate-900 text-white'}">AI</span>

                    <button onclick="navigateToTab('physical')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${state.activeTab === 'physical' ? 'bg-white text-blue-600 font-extrabold shadow-xs border border-slate-200/80' : 'text-slate-700 hover:text-slate-900 hover:bg-white/60'}">

                    <button onclick="navigateToTab('mental')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${state.activeTab === 'mental' ? 'bg-white text-blue-600 font-extrabold shadow-xs border border-slate-200/80' : 'text-slate-700 hover:text-slate-900 hover:bg-white/60'}">
                      <div class="flex items-center gap-3"><span></span><span>Mental & AI Coach</span></div>
                    </button>
                    <button onclick="navigateToTab('social')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${state.activeTab === 'social' ? 'bg-white text-blue-600 font-extrabold shadow-xs border border-slate-200/80' : 'text-slate-700 hover:text-slate-900 hover:bg-white/60'}">

                    </button>
                    <button onclick="navigateToTab('inclusive')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${state.activeTab === 'inclusive' ? 'bg-white text-blue-600 font-extrabold shadow-xs border border-slate-200/80' : 'text-slate-700 hover:text-slate-900 hover:bg-white/60'}">

    // ================= PROTOTYPE REDIRECT HANDLERS =================
    function render() {
      const root = document.getElementById('app');
      if (!state.isLoggedIn) {
        root.innerHTML = renderLoginPage();
      } else {
        root.innerHTML = renderAppLayout();
      }
    }

    function setRole(role) {
      state.userRole = role;
      state.activeTab = role === 'hr_manager' ? 'hr' : 'dashboard';
      render();
    }

    function navigateToApp(e) {
      if (e && e.preventDefault) e.preventDefault();
      state.isLoggedIn = true;
      state.activeTab = state.userRole === 'hr_manager' ? 'hr' : 'dashboard';
      render();
    }

    function navigateToTab(tabId) {
      state.activeTab = tabId;
      render();
    }

    function logout() {
      state.isLoggedIn = false;
      render();
    }

    function toggleFocusMode() {
      state.focusMode = !state.focusMode;
      render();
    }

    function toggleBoundaryShield() {
      state.boundaryShield = !state.boundaryShield;
      render();
    }

    function toggleDyslexiaFont() {
      state.dyslexiaFont = !state.dyslexiaFont;
      render();
    }

    // Initial render
    render();
